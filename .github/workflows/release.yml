name: Build and Release

# Runs whenever you push a tag like v1.0.0 - see the "Cutting a release"
# section in README.md for the exact commands.
on:
  push:
    tags:
      - "v*.*.*"

# Needed so this workflow is allowed to create a release and upload files to it.
permissions:
  contents: write

jobs:
  build-and-release:
    # WinForms targets net8.0-windows, so this has to build on a Windows runner.
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish framework-dependent build
        run: >
          dotnet publish BorderlessApp.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/framework-dependent

      - name: Publish self-contained build
        run: >
          dotnet publish BorderlessApp.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/self-contained

      - name: Package framework-dependent build
        shell: pwsh
        run: |
          # This build is multiple files (BorderlessApp.exe + its .dll and
          # .json config) that all need to sit together in one folder - the
          # .exe alone can't run without them. Zip the whole output folder.
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path "publish/framework-dependent/*" -DestinationPath "release-assets/BorderlessApp-FrameworkDependent.zip"

      - name: Rename self-contained build
        shell: pwsh
        run: |
          # This one truly is a single file (runtime bundled in), so no zip needed.
          Copy-Item "publish/self-contained/BorderlessApp.exe" "release-assets/BorderlessApp-SelfContained.exe"

      - name: Stamp installer version from the tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          (Get-Content installer.iss) -replace '__VERSION__', $version | Set-Content installer.iss

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"'

      - name: Copy installer to release assets
        shell: pwsh
        run: Copy-Item "installer-output\BorderlessApp-Setup.exe" "release-assets\BorderlessApp-Setup.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/BorderlessApp-Setup.exe
            release-assets/BorderlessApp-FrameworkDependent.zip
            release-assets/BorderlessApp-SelfContained.exe
          generate_release_notes: true
          body: |
            **BorderlessApp-Setup.exe** - recommended. Proper installer: Start Menu shortcut, optional desktop shortcut, and shows up in Windows Settings > Apps so you can uninstall it cleanly from there. No dependencies needed.

            **BorderlessApp-FrameworkDependent.zip** - portable, no install. Unzip it (keep all the files together in one folder) and run `BorderlessApp.exe`. Requires the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) to already be installed.

            **BorderlessApp-SelfContained.exe** - portable, no install, single file (~150MB), but works standalone with nothing else to install.

            Unsigned build - Windows SmartScreen may warn on first run. Click "More info" -> "Run anyway".
